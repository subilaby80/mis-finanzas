<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finanzas Personales - App Web</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para iconos limpios -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js para estadísticas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="h-full bg-slate-50 text-slate-800 font-sans antialiased flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <!-- HEADER / SUPERIOR -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 text-white p-2 rounded-xl shadow-sm flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-wallet text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight text-slate-900">Mis Finanzas</h1>
                    <p id="current-month-display" class="text-xs text-slate-500 capitalize">Cargando...</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="changeMonth(-1)" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition" title="Mes anterior">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button onclick="resetToCurrentMonth()" class="px-2.5 py-1 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition">
                    Hoy
                </button>
                <button onclick="changeMonth(1)" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition" title="Mes siguiente">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main-content" class="flex-1 max-w-4xl w-full mx-auto p-4 pb-28 overflow-y-auto">
        <!-- Las vistas se cargan dinámicamente aquí mediante JavaScript -->
    </main>

    <!-- BOTÓN FLOTANTE RÁPIDO (+) -->
    <button onclick="openTransactionModal()" class="fixed right-5 bottom-20 bg-brand-600 hover:bg-brand-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl transition transform hover:scale-105 active:scale-95 z-40 focus:outline-none" title="Añadir movimiento">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- NAVEGACIÓN INFERIOR (MOBILE-FIRST) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-30 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-around py-2 px-1">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center flex-1 py-1 text-brand-600 transition">
                <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Inicio</span>
            </button>
            <button onclick="switchTab('transactions')" id="nav-transactions" class="flex flex-col items-center flex-1 py-1 text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-list-ul text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Movimientos</span>
            </button>
            <button onclick="switchTab('recurring')" id="nav-recurring" class="flex flex-col items-center flex-1 py-1 text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-repeat text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Recurrentes</span>
            </button>
            <button onclick="switchTab('forecast')" id="nav-forecast" class="flex flex-col items-center flex-1 py-1 text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-chart-line text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Previsión</span>
            </button>
            <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center flex-1 py-1 text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-chart-column text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Estadísticas</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center flex-1 py-1 text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-gear text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Ajustes</span>
            </button>
        </div>
    </nav>

    <!-- MODAL UNIFICADO PARA NUEVO / EDITAR MOVIMIENTO -->
    <div id="transaction-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center sticky top-0 bg-white z-10">
                <h3 id="modal-title" class="font-bold text-slate-900 text-lg">Nuevo Movimiento</h3>
                <button onclick="closeTransactionModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form id="transaction-form" onsubmit="saveTransaction(event)" class="p-4 space-y-4 flex-1">
                <input type="hidden" id="tx-id">
                <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                    <button type="button" id="type-expense-btn" onclick="setTxType('gasto')" class="py-2.5 rounded-lg font-medium text-sm transition bg-white text-red-600 shadow-xs">Gasto</button>
                    <button type="button" id="type-income-btn" onclick="setTxType('ingreso')" class="py-2.5 rounded-lg font-medium text-sm transition text-slate-600">Ingreso</button>
                </div>
                <input type="hidden" id="tx-type" value="gasto">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Concepto</label>
                    <input type="text" id="tx-concept" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm" placeholder="Ej. Supermercado, Nómina...">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Importe (€)</label>
                        <input type="number" step="0.01" id="tx-amount" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha</label>
                        <input type="date" id="tx-date" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Categoría</label>
                    <select id="tx-category" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                        <!-- Categorías dinámicas -->
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Notas (opcional)</label>
                    <textarea id="tx-notes" rows="2" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm" placeholder="Detalles adicionales..."></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-3 rounded-xl transition shadow-md">Guardar Movimiento</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL DE LA APLICACIÓN -->
    <script>
        // --- BASE DE DATOS INDEXEDDB ---
        const DB_NAME = 'finanzas_personales_db';
        const DB_VERSION = 1;
        let db = null;

        const DEFAULT_CATEGORIES = {
            gasto: [
                'Vivienda', 'Alimentación', 'Transporte', 'Coche', 'Combustible', 
                'Seguros', 'Facturas', 'Suscripciones', 'Ocio', 'Compras', 
                'Salud', 'Educación', 'Impuestos', 'Viajes', 'Otros'
            ],
            ingreso: [
                'Nómina', 'Paga extra', 'Alquileres', 'Ventas', 'Devoluciones', 'Otros ingresos'
            ]
        };

        const DEFAULT_BUDGETS = {
            'Alimentación': 400,
            'Ocio': 150,
            'Coche': 200,
            'Vivienda': 750,
            'Facturas': 150
        };

        const INITIAL_DEMO_DATA = {
            transactions: [
                { id: 't1', type: 'ingreso', concept: 'Nómina Empresa', amount: 2200, date: '2026-10-01', category: 'Nómina', notes: 'Mensual' },
                { id: 't2', type: 'gasto', concept: 'Alquiler piso', amount: 700, date: '2026-10-02', category: 'Vivienda', notes: 'Cuota mensual' },
                { id: 't3', type: 'gasto', concept: 'Supermercado Mercadona', amount: 125.50, date: '2026-10-03', category: 'Alimentación', notes: 'Compra semanal' },
                { id: 't4', type: 'gasto', concept: 'Gasolina coche', amount: 60, date: '2026-10-05', category: 'Combustible', notes: 'Depósito lleno' },
                { id: 't5', type: 'gasto', concept: 'Netflix & Spotify', amount: 24.98, date: '2026-10-06', category: 'Suscripciones', notes: 'Mensual' }
            ],
            recurring: [
                { id: 'r1', type: 'ingreso', concept: 'Nómina Principal', amount: 2200, category: 'Nómina', day: 1, startDate: '2025-01-01', periodicity: 'mensual', customInterval: 1, unit: 'meses', isFixed: true, notes: 'Salario neto' },
                { id: 'r2', type: 'gasto', concept: 'Alquiler Vivienda', amount: 700, category: 'Vivienda', day: 2, startDate: '2025-01-01', periodicity: 'mensual', customInterval: 1, unit: 'meses', isFixed: true, notes: 'Alquiler fijo' },
                { id: 'r3', type: 'gasto', concept: 'Seguro del Coche', amount: 600, category: 'Seguros', day: 15, startDate: '2026-01-15', periodicity: 'anual', customInterval: 12, unit: 'meses', isFixed: true, notes: 'Prorrateable 50€/mes' },
                { id: 'r4', type: 'gasto', concept: 'Factura Luz Trimestral', amount: 300, category: 'Facturas', day: 20, startDate: '2026-01-20', periodicity: 'trimestral', customInterval: 3, unit: 'meses', isFixed: false, notes: 'Prorrateable 100€/mes' }
            ],
            categories: DEFAULT_CATEGORIES,
            budgets: DEFAULT_BUDGETS,
            settings: { currency: '€', firstDay: 1 }
        };

        let appState = {
            currentDate: new Date(),
            currentTab: 'dashboard',
            transactions: [],
            recurring: [],
            categories: DEFAULT_CATEGORIES,
            budgets: DEFAULT_BUDGETS,
            settings: { currency: '€', firstDay: 1 }
        };

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains('store')) {
                        database.createObjectStore('store', { keyPath: 'key' });
                    }
                };
            });
        }

        async function saveToDB() {
            if (!db) return;
            const tx = db.transaction('store', 'readwrite');
            const store = tx.objectStore('store');
            await store.put({ key: 'data', value: {
                transactions: appState.transactions,
                recurring: appState.recurring,
                categories: appState.categories,
                budgets: appState.budgets,
                settings: appState.settings
            }});
        }

        async function loadFromDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction('store', 'readonly');
                const store = tx.objectStore('store');
                const request = store.get('data');
                request.onsuccess = () => {
                    if (request.result) {
                        const d = request.result.value;
                        appState.transactions = d.transactions || [];
                        appState.recurring = d.recurring || [];
                        appState.categories = d.categories || DEFAULT_CATEGORIES;
                        appState.budgets = d.budgets || DEFAULT_BUDGETS;
                        appState.settings = d.settings || { currency: '€', firstDay: 1 };
                        resolve(true);
                    } else {
                        // Cargar datos demo iniciales
                        appState.transactions = INITIAL_DEMO_DATA.transactions;
                        appState.recurring = INITIAL_DEMO_DATA.recurring;
                        appState.categories = INITIAL_DEMO_DATA.categories;
                        appState.budgets = INITIAL_DEMO_DATA.budgets;
                        appState.settings = INITIAL_DEMO_DATA.settings;
                        saveToDB().then(() => resolve(true));
                    }
                };
                request.onerror = () => reject(request.error);
            });
        }

        // --- INICIALIZACIÓN Y NAVEGACIÓN ---
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initDB();
                await loadFromDB();
                checkAndGenerateRecurring();
                renderView();
            } catch (e) {
                console.error("Error inicializando IndexedDB:", e);
            }
        });

        function switchTab(tab) {
            appState.currentTab = tab;
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-brand-600');
                btn.classList.add('text-slate-400');
            });
            const activeNav = document.getElementById(`nav-${tab}`);
            if (activeNav) {
                activeNav.classList.remove('text-slate-400');
                activeNav.classList.add('text-brand-600');
            }
            renderView();
        }

        function changeMonth(delta) {
            appState.currentDate.setMonth(appState.currentDate.getMonth() + delta);
            renderView();
        }

        function resetToCurrentMonth() {
            appState.currentDate = new Date();
            renderView();
        }

        function renderView() {
            updateMonthDisplay();
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            switch(appState.currentTab) {
                case 'dashboard':
                    container.innerHTML = renderDashboardHTML();
                    initDashboardCharts();
                    break;
                case 'transactions':
                    container.innerHTML = renderTransactionsHTML();
                    break;
                case 'recurring':
                    container.innerHTML = renderRecurringHTML();
                    break;
                case 'forecast':
                    container.innerHTML = renderForecastHTML();
                    break;
                case 'stats':
                    container.innerHTML = renderStatsHTML();
                    initStatsCharts();
                    break;
                case 'settings':
                    container.innerHTML = renderSettingsHTML();
                    break;
            }
        }

        function updateMonthDisplay() {
            const options = { month: 'long', year: 'numeric' };
            const formatted = appState.currentDate.toLocaleDateString('es-ES', options);
            document.getElementById('current-month-display').textContent = formatted;
        }

        // --- GENERACIÓN AUTOMÁTICA DE RECURRENTES ---
        function checkAndGenerateRecurring() {
            // Genera automáticamente los movimientos recurrentes para el mes actual y anterior si no existen
            const curYear = appState.currentDate.getFullYear();
            const curMonth = appState.currentDate.getMonth();

            appState.recurring.forEach(rec => {
                const startDate = new Date(rec.startDate);
                let targetDate = new Date(curYear, curMonth, rec.day || 1);
                
                if (targetDate >= startDate) {
                    const dateStr = targetDate.toISOString().split('T')[0];
                    // Comprobar si ya existe un movimiento con el mismo concepto y fecha aproximada o ID recurrente
                    const exists = appState.transactions.some(t => 
                        t.concept === rec.concept && 
                        t.date.startsWith(`${curYear}-${String(curMonth + 1).padStart(2, '0')}`)
                    );

                    if (!exists) {
                        appState.transactions.push({
                            id: 'auto_' + Math.random().toString(36.substring(2, 9)),
                            type: rec.type,
                            concept: rec.concept,
                            amount: rec.amount,
                            date: dateStr,
                            category: rec.category,
                            notes: `Generado automáticamente (${rec.notes || ''})`
                        });
                    }
                }
            });
            saveToDB();
        }

        // --- CÁLCULOS FINANCIEROS Y PRORRATEO ---
        function getFilteredTransactionsForMonth(year, month) {
            return appState.transactions.filter(t => {
                const d = new Date(t.date);
                return d.getFullYear() === year && d.getMonth() === month;
            });
        }

        function calculateMonthlyFinancials(year, month) {
            const txs = getFilteredTransactionsForMonth(year, month);
            let income = 0;
            let expense = 0;

            txs.forEach(t => {
                if (t.type === 'ingreso') income += t.amount;
                else if (t.type === 'gasto') expense += t.amount;
            });

            const balance = income - expense;
            const savingsRate = income > 0 ? Math.max(0, (balance / income) * 100) : 0;

            // Cálculo de Prorrateo para gastos futuros no mensuales
            let monthlyProratedReserve = 0;
            appState.recurring.forEach(r => {
                if (r.type === 'gasto') {
                    let monthlyEquivalent = 0;
                    if (r.periodicity === 'anual') monthlyEquivalent = r.amount / 12;
                    else if (r.periodicity === 'trimestral') monthlyEquivalent = r.amount / 3;
                    else if (r.periodicity === 'bimestral' || r.periodicity === 'cada 2 meses') monthlyEquivalent = r.amount / 2;
                    else if (r.periodicity === 'semestral') monthlyEquivalent = r.amount / 6;
                    else if (r.periodicity === 'semanal') monthlyEquivalent = r.amount * 4.33;
                    else if (r.periodicity === 'personalizada') {
                        const interval = r.customInterval || 1;
                        if (r.unit === 'meses') monthlyEquivalent = r.amount / interval;
                        else if (r.unit === 'semanas') monthlyEquivalent = (r.amount * 4.33) / interval;
                    }
                    if (monthlyEquivalent > 0) {
                        monthlyProratedReserve += monthlyEquivalent;
                    }
                }
            });

            const availableMoney = income - expense - monthlyProratedReserve;

            return {
                income,
                expense,
                balance,
                savings: balance > 0 ? balance : 0,
                savingsRate,
                monthlyProratedReserve,
                availableMoney
            };
        }

        // --- VISTA 1: DASHBOARD ---
        function renderDashboardHTML() {
            const year = appState.currentDate.getFullYear();
            const month = appState.currentDate.getMonth();
            const currentFin = calculateMonthlyFinancials(year, month);

            // Mes anterior para comparación
            const prevDate = new Date(year, month - 1, 1);
            const prevFin = calculateMonthlyFinancials(prevDate.getFullYear(), prevDate.getMonth());
            const diffBalance = currentFin.balance - prevFin.balance;

            return `
                <div class="space-y-4">
                    <!-- Tarjeta Principal de Balance -->
                    <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
                        <div class="absolute right-0 top-0 translate-x-4 -translate-y-4 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl"></div>
                        <p class="text-xs uppercase tracking-wider text-slate-400 font-medium">Balance del Mes</p>
                        <h2 class="text-3xl font-bold mt-1 ${currentFin.balance >= 0 ? 'text-white' : 'text-red-400'}">
                            ${currentFin.balance.toFixed(2)} ${appState.settings.currency}
                        </h2>
                        <div class="mt-4 pt-4 border-t border-slate-700/60 grid grid-cols-2 gap-4 text-sm">
                            <div>
                                <span class="text-xs text-slate-400 block">Dinero Disponible</span>
                                <span class="font-semibold text-emerald-400 text-base">${currentFin.availableMoney.toFixed(2)} ${appState.settings.currency}</span>
                            </div>
                            <div>
                                <span class="text-xs text-slate-400 block">Reserva Prorrateo</span>
                                <span class="font-semibold text-amber-400 text-base">${currentFin.monthlyProratedReserve.toFixed(2)} ${appState.settings.currency}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Cuadrícula de Métricas Clave -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                            <div class="flex items-center space-x-2 text-emerald-600 mb-1">
                                <i class="fa-solid fa-arrow-trend-up text-sm"></i>
                                <span class="text-xs font-semibold uppercase">Ingresos</span>
                            </div>
                            <p class="text-xl font-bold text-slate-900">+${currentFin.income.toFixed(2)} ${appState.settings.currency}</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                            <div class="flex items-center space-x-2 text-red-500 mb-1">
                                <i class="fa-solid fa-arrow-trend-down text-sm"></i>
                                <span class="text-xs font-semibold uppercase">Gastos</span>
                            </div>
                            <p class="text-xl font-bold text-slate-900">-${currentFin.expense.toFixed(2)} ${appState.settings.currency}</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                            <div class="flex items-center space-x-2 text-blue-600 mb-1">
                                <i class="fa-solid fa-piggy-bank text-sm"></i>
                                <span class="text-xs font-semibold uppercase">Ahorro</span>
                            </div>
                            <p class="text-xl font-bold text-slate-900">${currentFin.savings.toFixed(2)} ${appState.settings.currency}</p>
                            <span class="text-[10px] text-slate-500">${currentFin.savingsRate.toFixed(1)}% tasa de ahorro</span>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                            <div class="flex items-center space-x-2 text-purple-600 mb-1">
                                <i class="fa-solid fa-chart-line text-sm"></i>
                                <span class="text-xs font-semibold uppercase">Vs. Mes Ant.</span>
                            </div>
                            <p class="text-xl font-bold ${diffBalance >= 0 ? 'text-emerald-600' : 'text-red-500'}">
                                ${diffBalance >= 0 ? '+' : ''}${diffBalance.toFixed(2)} ${appState.settings.currency}
                            </p>
                        </div>
                    </div>

                    <!-- Presupuestos Rápidos -->
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <h3 class="font-bold text-slate-900 text-sm mb-3 flex items-center justify-between">
                            <span>Presupuestos Principales</span>
                            <button onclick="switchTab('settings')" class="text-xs text-brand-600 hover:underline">Gestionar</button>
                        </h3>
                        <div class="space-y-3">
                            ${renderBudgetsProgress(year, month)}
                        </div>
                    </div>

                    <!-- Gráfico Rápido Dashboard -->
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <h3 class="font-bold text-slate-900 text-sm mb-3">Distribución de Gastos</h3>
                        <div class="h-48 flex items-center justify-center">
                            <canvas id="dashboardChart"></canvas>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBudgetsProgress(year, month) {
            const txs = getFilteredTransactionsForMonth(year, month);
            const categoryExpenses = {};
            txs.filter(t => t.type === 'gasto').forEach(t => {
                categoryExpenses[t.category] = (categoryExpenses[t.category] || 0) + t.amount;
            });

            let html = '';
            const entries = Object.entries(appState.budgets);
            if (entries.length === 0) return '<p class="text-xs text-slate-400">No hay presupuestos configurados.</p>';

            entries.forEach(([cat, limit]) => {
                const spent = categoryExpenses[cat] || 0;
                const pct = Math.min(100, (spent / limit) * 100);
                let barColor = 'bg-brand-500';
                if (pct > 85) barColor = 'bg-amber-500';
                if (pct >= 100) barColor = 'bg-red-500';

                html += `
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="font-medium text-slate-700">${cat}</span>
                            <span class="text-slate-500">${spent.toFixed(2)} / ${limit} ${appState.settings.currency} (${pct.toFixed(0)}%)</span>
                        </div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                            <div class="${barColor} h-2 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            });
            return html;
        }

        function initDashboardCharts() {
            const year = appState.currentDate.getFullYear();
            const month = appState.currentDate.getMonth();
            const txs = getFilteredTransactionsForMonth(year, month).filter(t => t.type === 'gasto');
            
            const catTotals = {};
            txs.forEach(t => {
                catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
            });

            const ctx = document.getElementById('dashboardChart');
            if (!ctx) return;

            const labels = Object.keys(catTotals);
            const data = Object.values(catTotals);

            if (labels.length === 0) {
                ctx.parentElement.innerHTML = '<p class="text-xs text-slate-400">Sin gastos este mes.</p>';
                return;
            }

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#16a34a', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } }
                    }
                }
            });
        }

        // --- VISTA 2: MOVIMIENTOS ---
        let txSearchQuery = '';
        let txFilterType = 'todos';
        let txSortBy = 'date-desc';

        function renderTransactionsHTML() {
            const year = appState.currentDate.getFullYear();
            const month = appState.currentDate.getMonth();

            // Filtrar
            if (txFilterType !== 'todos') {

            txs.sort((a, b) => {
                if (txSortBy === 'date-desc') return new Date(b.date) - new Date(a.date);
                if (txSortBy === 'date-asc') return new Date(a.date) - new Date(b.date);
                if (txSortBy === 'amount-desc') return b.amount - a.amount;

                                <button onclick="setTxFilter('ingreso')" class="px-3 py-1.5 rounded-lg font-medium transition ${txFilterType === 'ingreso' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}">Ingresos</button>
                                <button onclick="setTxFilter('gasto')" class="px-3 py-1.5 rounded-lg font-medium transition ${txFilterType === 'gasto' ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-600'}">Gastos</button>
                            </div>
                            <select onchange="setTxSort(this.value)" class="bg-slate-100 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-700 font-medium focus:outline-none">
                                <option value="date-desc" ${txSortBy === 'date-desc' ? 'selected' : ''}>Más recientes</option>
                                <option value="date-asc" ${txSortBy === 'date-asc' ? 'selected' : ''}>Más antiguos</option>
                                <option value="amount-desc" ${txSortBy === 'amount-desc' ? 'selected' : ''}>Mayor importe</option>
                                <option value="amount-asc" ${txSortBy === 'amount-asc' ? 'selected' : ''}>Menor importe</option>
                                <option value="category" ${txSortBy === 'category' ? 'selected' : ''}>Categoría</option>
                            </select>
                        </div>
                    </div>

                    <!-- Lista de Movimientos -->
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden divide-y divide-slate-100">
                        ${txs.length === 0 ? '<div class="p-8 text-center text-slate-400 text-sm">No se encontraron movimientos.</div>' : txs.map(t => `
                            <div class="p-3.5 flex items-center justify-between hover:bg-slate-50 transition">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${t.type === 'ingreso' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-500'}">

                                    </div>

                                <div class="flex items-center space-x-3">

                                    </span>
                                    <div class="flex items-center space-x-1">

                if (txFilterType !== 'todos') txs = txs.filter(t => t.type === txFilterType);

        function openTransactionModal(editId = null) {
            const modal = document.getElementById('transaction-modal');
            modal.classList.remove('hidden');
            
            if (editId) {
                document.getElementById('modal-title').textContent = 'Editar Movimiento';
                const t = appState.transactions.find(x => x.id === editId);
                if (t) {
                    document.getElementById('tx-id').value = t.id;
                    setTxType(t.type);
                    document.getElementById('tx-concept').value = t.concept;
                    document.getElementById('tx-amount').value = t.amount;
                    document.getElementById('tx-date').value = t.date;
                    populateCategories(t.type, t.category);
                    document.getElementById('tx-notes').value = t.notes || '';
                }
            } else {
                document.getElementById('modal-title').textContent = 'Nuevo Movimiento';
                document.getElementById('tx-id').value = '';
                setTxType('gasto');
                document.getElementById('tx-concept').value = '';
                document.getElementById('tx-amount').value = '';
                const todayStr = appState.currentDate.toISOString().split('T')[0];
                document.getElementById('tx-date').value = todayStr;
                populateCategories('gasto');
                document.getElementById('tx-notes').value = '';
            }

            document.getElementById('transaction-modal').classList.add('hidden');
        }

        function setTxType(type) {
            document.getElementById('tx-type').value = type;
            const expBtn = document.getElementById('type-expense-btn');
            const incBtn = document.getElementById('type-income-btn');
            if (type === 'gasto') {
                expBtn.className = 'py-2.5 rounded-lg font-medium text-sm transition bg-white text-red-600 shadow-xs';
                incBtn.className = 'py-2.5 rounded-lg font-medium text-sm transition text-slate-600';
            } else {
                incBtn.className = 'py-2.5 rounded-lg font-medium text-sm transition bg-white text-emerald-600 shadow-xs';
                expBtn.className = 'py-2.5 rounded-lg font-medium text-sm transition text-slate-600';
            }
            populateCategories(type);
        }

        function populateCategories(type, selected = null) {
            const select = document.getElementById('tx-category');
            const cats = appState.categories[type] || [];
            select.innerHTML = cats.map(c => `<option value="${c}" ${selected === c ? 'selected' : ''}>${c}</option>`).join('');
        }

        function saveTransaction(e) {
            e.preventDefault();
            const id = document.getElementById('tx-id').value;
            const type = document.getElementById('tx-type').value;
            const concept = document.getElementById('tx-concept').value;
            const amount = parseFloat(document.getElementById('tx-amount').value);
            const date = document.getElementById('tx-date').value;
            const category = document.getElementById('tx-category').value;
            const notes = document.getElementById('tx-notes').value;

            if (id) {
                const idx = appState.transactions.findIndex(t => t.id === id);
                if (idx !== -1) {
                    appState.transactions[idx] = { id, type, concept, amount, date, category, notes };
                }
            } else {
                const newTx = {
                    id: 'tx_' + Math.random().toString(36).substring(2, 9),
                    type, concept, amount, date, category, notes
                };
                appState.transactions.push(newTx);
            }

            saveToDB();
            closeTransactionModal();
            renderView();
        }

        function editTransaction(id) {
            openTransactionModal(id);
        }

        function deleteTransaction(id) {
            if (confirm('¿Estás seguro de eliminar este movimiento?')) {
                appState.transactions = appState.transactions.filter(t => t.id !== id);
                saveToDB();
                renderView();
            }
        }

        // --- VISTA 4: PREVISIÓN ---
        function renderForecastHTML() {
            let monthsAhead = 3; // Por defecto 3 meses
            let forecastHTML = '';
            let cumulativeBalance = 0;

            const now = new Date();
            for (let i = 1; i <= 6; i++) {
                const futureDate = new Date(now.getFullYear(), now.getMonth() + i, 1);
                const fin = calculateMonthlyFinancials(futureDate.getFullYear(), futureDate.getMonth());
                // Simulación predictiva basada en recurrentes
                let recIncome = 0;
                let recExpense = 0;
                appState.recurring.forEach(r => {
                    if (r.type === 'ingreso') recIncome += r.amount;
                    else recExpense += r.amount;
                });
                const estBalance = recIncome - recExpense;
                cumulativeBalance += estBalance;

                const monthName = futureDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
                forecastHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center font-bold text-xs uppercase">
                                +${i}m
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-900 text-sm capitalize">${monthName}</h4>
                                <p class="text-xs text-slate-400">Previsión recurrentes</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-sm ${estBalance >= 0 ? 'text-emerald-600' : 'text-red-500'}">${estBalance >= 0 ? '+' : ''}${estBalance.toFixed(2)} ${appState.settings.currency}</p>
                            <span class="text-[10px] text-slate-400">Acumulado: ${cumulativeBalance.toFixed(2)} ${appState.settings.currency}</span>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <h3 class="font-bold text-slate-900 text-sm">Previsión Financiera Futura</h3>
                        <p class="text-xs text-slate-500 mt-0.5">Estimación basada en tus ingresos y gastos recurrentes configurados.</p>
                    </div>
                    <div class="space-y-3">
                        ${forecastHTML}
                    </div>
                </div>
            `;
        }

        // --- VISTA 5: ESTADÍSTICAS ---
        function renderStatsHTML() {
            return `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <h3 class="font-bold text-slate-900 text-sm mb-3">Evolución Anual (Ingresos vs Gastos)</h3>
                        <div class="h-64 flex items-center justify-center">
                            <canvas id="statsBarChart"></canvas>
                        </div>
                    </div>
                </div>
            `;
        }

        function initStatsCharts() {
            const ctx = document.getElementById('statsBarChart');
            if (!ctx) return;

            const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
            const incomeData = new Array(12).fill(0);
            const expenseData = new Array(12).fill(0);

            const curYear = appState.currentDate.getFullYear();
            appState.transactions.forEach(t => {
                const d = new Date(t.date);
                if (d.getFullYear() === curYear) {
                    const m = d.getMonth();
                    if (t.type === 'ingreso') incomeData[m] += t.amount;
                    else if (t.type === 'gasto') expenseData[m] += t.amount;
                }
            });

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: months,
                    datasets: [
                        { label: 'Ingresos', data: incomeData, backgroundColor: '#16a34a', borderRadius: 4 },
                        { label: 'Gastos', data: expenseData, backgroundColor: '#ef4444', borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        // --- VISTA 6: AJUSTES ---
        function renderSettingsHTML() {
            return `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-4">
                        <h3 class="font-bold text-slate-900 text-sm border-b pb-2">Gestión de Datos y Copias de Seguridad</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="exportJSON()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-download"></i><span>Exportar JSON</span>
                            </button>
                            <label class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center space-x-2 cursor-pointer">
                                <i class="fa-solid fa-upload"></i><span>Importar JSON</span>
                                <input type="file" accept=".json" onchange="importJSON(event)" class="hidden">
                            </label>
                        </div>
                        <div class="pt-2">
                            <button onclick="resetDemoData()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-medium py-2.5 rounded-xl text-xs transition">
                                <i class="fa-solid fa-trash-can mr-1"></i> Borrar y cargar datos de demostración
                            </button>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <h3 class="font-bold text-slate-900 text-sm mb-2">Acerca de la Aplicación</h3>
                        <p class="text-xs text-slate-500 leading-relaxed">
                            App web personal de finanzas desarrollada en arquitectura puramente local (IndexedDB) sin servidores ni registro. Preparada para GitHub Pages.
                        </p>
                    </div>
                </div>
            `;
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `finanzas_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.transactions && parsed.recurring) {
                        appState.transactions = parsed.transactions;
                        appState.recurring = parsed.recurring;
                        appState.categories = parsed.categories || DEFAULT_CATEGORIES;
                        appState.budgets = parsed.budgets || DEFAULT_BUDGETS;
                        appState.settings = parsed.settings || { currency: '€', firstDay: 1 };
                        saveToDB();
                        renderView();
                        alert('Copia de seguridad restaurada con éxito.');
                    } else {
                        alert('El archivo no tiene un formato válido.');
                    }
                } catch (err) {
                    alert('Error al leer el archivo JSON.');
                }
            };
            reader.readAsText(file);
        }

        function resetDemoData() {
            if (confirm('¿Estás seguro de restablecer los datos de demostración? Se sobrescribirán los datos actuales.')) {
                appState.transactions = INITIAL_DEMO_DATA.transactions;
                appState.recurring = INITIAL_DEMO_DATA.recurring;
                appState.categories = INITIAL_DEMO_DATA.categories;
                appState.budgets = INITIAL_DEMO_DATA.budgets;
                saveToDB();
                renderView();
                alert('Datos de demostración cargados.');
            }
        }
    </script>
</body>
</html>
